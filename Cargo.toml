[workspace]
resolver = "3"
members = [
    "crates/trit-core",
    "crates/trit-eval",
    "crates/trit-sat",
    "crates/trit-circuit",
    "crates/trit-cli",
    "crates/trit-bdd",
    "crates/trit-policy",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bfxh/trit"

[workspace.dependencies]
trit-core = { path = "crates/trit-core", version = "0.3.0" }
trit-eval = { path = "crates/trit-eval", version = "0.3.0" }
trit-sat = { path = "crates/trit-sat", version = "0.3.0" }
trit-circuit = { path = "crates/trit-circuit", version = "0.3.0" }
trit-bdd = { path = "crates/trit-bdd", version = "0.3.0" }
trit-policy = { path = "crates/trit-policy", version = "0.3.0" }
